<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183b62" />
    <meta name="description" content="POC de polígonos no mapa" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Polígonos no mapa</title>
  </head>
  <body>
    <main class="shell" aria-labelledby="page-title">
      <div class="workspace">
        <aside class="polygon-sidebar" aria-label="Polígonos salvos">
          <div class="sidebar-heading">
            <button id="sidebar-close" class="icon-button sidebar-close" type="button" aria-expanded="true" aria-label="Recolher lista de polígonos" title="Recolher lista de polígonos">
              <i data-lucide="panel-left-close" aria-hidden="true"></i>
            </button>
            <h1 id="page-title">Polígonos</h1>
            <span id="polygon-count" class="polygon-count" aria-live="polite">0</span>
          </div>
          <p id="empty-state" class="empty-state">Nenhum polígono por enquanto.</p>
          <ul id="polygon-list" data-testid="polygon-list" class="polygon-list"></ul>
          <div class="sidebar-actions" aria-label="Ações dos polígonos">
            <button id="clear-polygons" data-testid="clear-polygons" class="clear-all-button danger" title="Remover todos os polígonos">
              <i data-lucide="trash-2" aria-hidden="true"></i>
              Apagar todos
            </button>
          </div>
        </aside>

        <section class="map-panel" aria-label="Editor de polígonos">
          <div id="map" data-testid="arcgis-map" aria-label="Mapa para desenhar polígonos"></div>
          <div class="map-controls" aria-label="Ferramentas de desenho">
            <button id="sidebar-toggle" data-testid="sidebar-toggle" class="icon-button sidebar-toggle" type="button" aria-expanded="false" aria-label="Abrir lista de polígonos" title="Abrir lista de polígonos">
              <i data-lucide="panel-left-close" aria-hidden="true"></i>
            </button>
            <button id="draw-polygon" data-testid="draw-polygon" class="icon-button" title="Criar um novo polígono" aria-label="Criar um novo polígono"><i data-lucide="plus" aria-hidden="true"></i></button>
            <button id="finish-drawing" data-testid="finish-drawing" hidden title="Concluir a ação atual">Concluir</button>
            <button id="cancel-editing" data-testid="cancel-editing" class="secondary" hidden title="Cancelar desenho ou edição atual">Cancelar</button>
          </div>
          <div class="map-status" aria-live="polite">
            <p id="map-instructions">Pronto para desenhar.</p>
            <p id="last-edit" data-testid="last-edit" class="last-edit">Nenhuma edição executada.</p>
          </div>
          <p id="map-ready" data-testid="map-ready" hidden>Mapa carregado</p>
        </section>
      </div>
    </main>
    <dialog id="clear-dialog" aria-labelledby="clear-dialog-title">
      <h2 id="clear-dialog-title">Confirmar remoção</h2>
      <p id="clear-dialog-description"></p>
      <div class="dialog-actions">
        <button id="dismiss-clear" type="button" class="secondary">Voltar</button>
        <button id="confirm-clear" type="button" class="danger">Apagar todos</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
